<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="#4f46e5"/>
  <!-- Wallet body -->
  <rect x="96" y="168" width="320" height="208" rx="24" fill="white" opacity="0.95"/>
  <!-- Wallet top flap -->
  <rect x="96" y="140" width="260" height="52" rx="16" fill="white" opacity="0.7"/>
  <!-- Coin slot / pocket -->
  <rect x="300" y="220" width="88" height="80" rx="16" fill="#4f46e5" opacity="0.15"/>
  <circle cx="344" cy="260" r="22" fill="#4f46e5" opacity="0.35"/>
  <!-- Dollar sign -->
  <text x="256" y="305" font-family="system-ui, -apple-system, sans-serif" font-size="88" font-weight="800" fill="#4f46e5" text-anchor="middle" opacity="0.9">$</text>
</svg>
